[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forkserve"
version = "0.1.0"
description = "Branch-aware speculative prefilling and CoW KV state for agentic LLM serving"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ForkServe Authors" }]
keywords = ["llm", "serving", "kv-cache", "speculative-prefill", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
vllm = ["vllm>=0.11.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/ForkServe/ForkServe"

[tool.setuptools.packages.find]
include = ["forkserve*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
